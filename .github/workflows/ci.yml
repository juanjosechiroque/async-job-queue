name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: async_job_queue
          POSTGRES_USER: async_job_queue
          POSTGRES_PASSWORD: async_job_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U async_job_queue -d async_job_queue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        env:
          DATABASE_URL: postgres://async_job_queue:async_job_queue@localhost:5432/async_job_queue?sslmode=disable
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build
        run: go build ./...
