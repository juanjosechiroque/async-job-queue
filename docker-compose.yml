services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: async_job_queue
      POSTGRES_USER: async_job_queue
      POSTGRES_PASSWORD: async_job_queue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U async_job_queue -d async_job_queue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
